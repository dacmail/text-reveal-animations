<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Reveal Animations · GSAP + ScrollTrigger</title>
  <meta name="description" content="Librería de efectos de aparición de texto con scroll, hechos con GSAP y ScrollTrigger. Escribe tu texto y prueba 24 efectos." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />

  <!-- GSAP + ScrollTrigger + Lenis (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
</head>
<body>
  <!-- Panel de controles -->
  <header class="panel">
    <div class="panel-brand">
      <span class="panel-title">TEXT REVEAL</span>
      <span class="panel-sub">GSAP · SCROLLTRIGGER</span>
    </div>

    <div class="panel-controls">
      <label class="field field-text">
        <span>Texto</span>
        <input id="ctl-text" type="text" autocomplete="off" spellcheck="false" />
        <span id="ctl-counter" class="counter"></span>
      </label>

      <label class="field">
        <span>Fuente</span>
        <select id="ctl-font"></select>
      </label>

      <label class="field">
        <span>Peso</span>
        <select id="ctl-weight"></select>
      </label>

      <label class="field">
        <span>Tamaño <em id="ctl-size-val"></em></span>
        <input id="ctl-size" type="range" />
      </label>

      <button id="ctl-theme" class="theme-btn" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
    </div>
  </header>

  <main>
    <section class="intro te-section">
      <div class="intro-inner">
        <h1>Librería de efectos de aparición de texto</h1>
        <p>Escribe tu texto arriba, elige fuente, peso y tamaño, y haz scroll para ver cómo aparece y desaparece en cada efecto. Todo con GSAP + ScrollTrigger.</p>
        <p class="scroll-hint">↓ Scroll</p>
      </div>
    </section>

    <!-- Las secciones de efectos se inyectan aquí -->
    <div id="effects"></div>

    <footer class="footer te-section">
      <p>Hecho con GSAP + ScrollTrigger · <a href="https://github.com/dacmail/text-reveal-animations" target="_blank" rel="noopener">GitHub</a></p>
    </footer>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
