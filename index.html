<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Reveal Animations · GSAP + ScrollTrigger</title>
  <meta name="description" content="Librería de efectos de aparición de texto con scroll, hechos con GSAP y ScrollTrigger. Escribe tu texto y prueba 24 efectos." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />

  <!-- GSAP + ScrollTrigger + Lenis (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
</head>
<body>
  <!-- Panel de controles -->
  <header class="panel">
    <div class="panel-brand">
      <span class="panel-title">TEXT REVEAL</span>
      <span class="panel-sub">GSAP · SCROLLTRIGGER</span>
    </div>

    <div class="panel-controls">
      <label class="field field-text">
        <span>Texto</span>
        <input id="ctl-text" type="text" autocomplete="off" spellcheck="false" />
        <span id="ctl-counter" class="counter"></span>
      </label>

      <label class="field">
        <span>Fuente</span>
        <select id="ctl-font"></select>
      </label>

      <label class="field">
        <span>Peso</span>
        <select id="ctl-weight"></select>
      </label>

      <label class="field">
        <span>Tamaño <em id="ctl-size-val"></em></span>
        <input id="ctl-size" type="range" />
      </label>

      <button id="ctl-theme" class="theme-btn" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
    </div>
  </header>

  <main>
    <section class="intro te-section">
      <div class="intro-inner">
        <h1>Librería de efectos de aparición de texto</h1>
        <p>Escribe tu texto arriba, elige fuente, peso y tamaño, y haz scroll para ver cómo aparece y desaparece en cada efecto. Todo con GSAP + ScrollTrigger.</p>
        <p class="scroll-hint">↓ Scroll</p>
      </div>
    </section>

    <!-- Las secciones de efectos se inyectan aquí -->
    <div id="effects"></div>

    <footer class="footer te-section">
      <p>Hecho con GSAP + ScrollTrigger · <a href="https://github.com/dacmail/text-reveal-animations" target="_blank" rel="noopener">GitHub</a></p>
    </footer>
  </main>

  <!-- Enlaces sociales flotantes -->
  <nav class="social" aria-label="Enlaces">
    <a href="https://x.com/dacmail" target="_blank" rel="noopener" title="X (@dacmail)" aria-label="X">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
    </a>
    <a href="https://github.com/dacmail/text-reveal-animations" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path d="M12 .5C5.37.5 0 5.78 0 12.29c0 5.21 3.44 9.63 8.21 11.19.6.11.82-.25.82-.56 0-.28-.01-1.02-.02-2-3.34.71-4.04-1.58-4.04-1.58-.55-1.37-1.34-1.74-1.34-1.74-1.09-.73.08-.72.08-.72 1.2.08 1.84 1.21 1.84 1.21 1.07 1.8 2.81 1.28 3.5.98.11-.76.42-1.28.76-1.57-2.67-.3-5.47-1.3-5.47-5.8 0-1.28.47-2.33 1.23-3.15-.12-.3-.53-1.51.12-3.15 0 0 1-.31 3.3 1.2a11.6 11.6 0 0 1 6 0c2.3-1.51 3.3-1.2 3.3-1.2.65 1.64.24 2.85.12 3.15.77.82 1.23 1.87 1.23 3.15 0 4.51-2.81 5.5-5.49 5.79.43.36.81 1.08.81 2.18 0 1.58-.01 2.85-.01 3.24 0 .31.21.68.83.56A12.03 12.03 0 0 0 24 12.29C24 5.78 18.63.5 12 .5z"/>
      </svg>
    </a>
  </nav>

  <script type="module" src="js/main.js"></script>
</body>
</html>
